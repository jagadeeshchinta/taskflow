apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
data:
  NODE_ENV: "production"
  FRONTEND_PORT: "3000"
  BACKEND_PORT: "3001"
  PORT: "3001"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://taskflow-backend:3001/api"
  NEXT_PUBLIC_WS_URL: "ws://taskflow-backend:3001"
  API_URL: "http://taskflow-backend:3001"
  METRICS_PATH: "/metrics"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  AUTH_TRUST_HOST: "true"
